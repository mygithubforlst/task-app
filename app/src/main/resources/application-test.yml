server:
  port: 8080
  servlet:
    context-path: /${spring.application.name}
    encoding:
      charset: UTF-8
      enabled: true
      force: true

nrec:
  #swagger 配置
  swagger:
    #在线文档作者
    author: admin
    #作者联系人邮箱
    email: admin@nrec.com
    #接口简介
    description: ${spring.application.name} Server API
    #扫描基础包路径，一般指向 返回实体和控制层
    base-package: com.nrec.service.app.controller
  exception:
    #错误编码前缀，生产环境，如果有多个服务，需要区分开来.前缀从99递减
    code-prefix: 99
  i18n:
    config-type: file
  task:
    jwt:
      # 开发环境固定密钥（非生产真实密钥）。HS256 要求长度 >= 32 字节。
      secret: dev-only-jwt-secret-key-for-task-app-nrec-0123456789abcdefghijklmnop
      # token 过期时间：24 小时（毫秒）
      expiration: 86400000

spring:
  ################# 数据源配置 ###################
  datasource:
    # JDBC 配置（本地库，密码走环境变量占位，绝不落明文）
    url: jdbc:mysql://localhost:5506/task_app?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true
    username: root
    password: ${TASK_DB_PASSWORD}

    # 连接池配置
    hikari:
      ## 最小空闲连接数量
      minimum-idle: 5
      ## 数据库连接超时时间,默认30秒，即30000
      connection-timeout: 30000
      ## 空闲连接存活最大时间，默认600000（10分钟）
      idle-timeout: 180000
      ## 空闲连接存活最大时间
      max-lifetime: 1800000
      ## 最大连接数
      maximum-pool-size: 20

################# mybatis-plus配置 ###################
mybatis-plus:
  mapper-locations: classpath:/mapper/*Mapper.xml
  typeAliasesPackage: com.nrec.service.app.entity

  configuration:
    #使用驼峰法映射属性
    map-underscore-to-camel-case: true
    cache-enabled: false

  global-config:
    db-config:
      #主键类型  0: 数据库ID自增, 1: 无状态 2:用户输入ID, 3: 全局唯一ID (数字类型唯一ID), 4: 全局唯一ID UUID
      id-type: assign_uuid
      #数据库大写下划线转换
      #capital-mode: true
      #序列接口实现类配置
      #key-generator: com.baomidou.springboot.xxx
      #逻辑删除配置
      #logic-delete-value: 0
      #logic-not-delete-value: 1
      #logic-delete-field: delete

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    restart:
      enabled: true
    shutdown:
      enabled: true
    health:
      show-details: always
    logfile:
      external-file: ./nr_cloud/logs/${spring.application.name}/${spring.application.name}_info.log

info:
  app.name: ${spring.application.name}
  company.name: nrec