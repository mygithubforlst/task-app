spring:
  main:
    allow-bean-definition-overriding: true
  application:
    # 此处为服务ID，也是 context-path 的前缀：/task-app
    name: task-app
  jmx:
    default-domain: ${spring.application.name}
  cloud:
    # 本地验收不接任何注册中心（Nacos / Eureka）
    service-registry:
      type: NONE
    loadbalancer:
      ribbon:
        enabled: false
